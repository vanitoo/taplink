<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bearded DevOps avatar</title>
  <desc id="desc">Stylized bearded DevOps engineer in a dark hoodie with terminal and server rack background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a20"/>
      <stop offset="1" stop-color="#1f1713"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>
  <circle cx="102" cy="88" r="80" fill="#38bdf8" opacity=".10"/>
  <circle cx="432" cy="420" r="120" fill="#a78bfa" opacity=".13"/>

  <g opacity=".45">
    <rect x="314" y="86" width="138" height="178" rx="16" fill="#0b1220" stroke="#60a5fa" stroke-width="4"/>
    <rect x="334" y="112" width="96" height="16" rx="8" fill="#1e40af"/>
    <rect x="334" y="148" width="96" height="16" rx="8" fill="#1e40af"/>
    <rect x="334" y="184" width="96" height="16" rx="8" fill="#1e40af"/>
    <circle cx="346" cy="120" r="5" fill="#22c55e"/>
    <circle cx="346" cy="156" r="5" fill="#22c55e"/>
    <circle cx="346" cy="192" r="5" fill="#22c55e"/>
  </g>

  <g opacity=".55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700" fill="#bae6fd">
    <text x="52" y="120">$ kubectl</text>
    <text x="52" y="150">deploy --prod</text>
    <text x="52" y="180">✓ healthy</text>
  </g>

