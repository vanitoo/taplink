  <ellipse cx="296" cy="266" rx="7" ry="9" fill="#1f2937"/>
  <path d="M250 274l-10 30 17 1" fill="none" stroke="#b87858" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

