  <path d="M167 245c0-96 42-144 100-144 67 0 104 57 92 138-32-20-55-46-70-74-35 38-76 57-122 60v20z" fill="#2b211e"/>
  <path d="M176 214c14-76 54-110 100-110 55 0 91 40 91 103-42-9-80-30-106-65-22 38-50 61-85 72z" fill="#362821"/>

  <path d="M173 275c9 80 50 125 83 125 38 0 78-43 88-123-16 10-33 13-48 9-22 15-54 15-75-1-18 6-34 3-48-10z" fill="url(#beard)"/>
  <path d="M198 296c22 14 35 16 58 16 24 0 42-5 60-18" fill="none" stroke="#6b4432" stroke-width="7" stroke-linecap="round"/>
